<svg xmlns="http://www.w3.org/2000/svg" width="900" height="346" viewBox="0 0 900 346" role="img" aria-labelledby="title desc"><title id="title">cuDF chunked reader stages</title><desc id="desc">Pass read limit influences pass and subpass planning. Chunk read limit governs returned output size.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#64748b"/></marker></defs><rect width="900" height="346" rx="8" fill="#fff"/><g font-family="system-ui,sans-serif" fill="#1e293b"><text x="32" y="40" font-size="22" font-weight="600">From file bytes to output tables</text><rect x="32" y="103" width="188" height="94" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="126.0" y="156.0" text-anchor="middle" font-size="17"></text><text x="126" y="140" text-anchor="middle" font-size="18">Selected</text><text x="126" y="168" text-anchor="middle" font-size="14">Row Groups</text><path d="M222 150 H243" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="248" y="103" width="188" height="94" rx="6" fill="#e0f2fe" stroke="#cbd5e1"/><text x="342.0" y="156.0" text-anchor="middle" font-size="17"></text><text x="342" y="140" text-anchor="middle" font-size="18">Input pass</text><text x="342" y="168" text-anchor="middle" font-size="14">load chunks</text><path d="M438 150 H459" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="464" y="103" width="188" height="94" rx="6" fill="#ede9fe" stroke="#cbd5e1"/><text x="558.0" y="156.0" text-anchor="middle" font-size="17"></text><text x="558" y="140" text-anchor="middle" font-size="18">Page subpass</text><text x="558" y="168" text-anchor="middle" font-size="14">decompress + decode</text><path d="M654 150 H675" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="103" width="188" height="94" rx="6" fill="#dcfce7" stroke="#cbd5e1"/><text x="774.0" y="156.0" text-anchor="middle" font-size="17"></text><text x="774" y="140" text-anchor="middle" font-size="18">Output tables</text><text x="774" y="168" text-anchor="middle" font-size="14">return to caller</text><path d="M248 215 V227 H652 V215" fill="none" stroke="#7c3aed"/><text x="450" y="254" text-anchor="middle" font-size="16">pass_read_limit: batching hint</text><text x="774" y="254" text-anchor="middle" font-size="16">chunk_read_limit</text><text x="774" y="278" text-anchor="middle" font-size="13" fill="#64748b">output-table size hint</text><text x="32" y="320" font-size="14" fill="#64748b">Schematic: passes, subpasses, and returned tables have distinct boundaries.</text></g></svg>
